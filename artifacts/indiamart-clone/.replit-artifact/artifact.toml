kind = "web"
previewPath = "/"
title = "IndiaConnect Marketplace"
version = "1.0.0"
id = "artifacts/indiamart-clone"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25363

[services.development]
run = "pnpm --filter @workspace/indiamart-clone run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/indiamart-clone", "run", "build" ]
serve = "static"
publicDir = "artifacts/indiamart-clone/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25363"
BASE_PATH = "/"
